<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tvorba rozvrhu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#f6f5f1;
    --paper:#ffffff;
    --ink:#20241f;
    --muted:#6b7066;
    --line:#d9d6cc;
    --ok:#2f6d4f;
    --bad:#b3452e;
    --lock:#3a3d38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Iowan Old Style','Georgia',serif;
    background:var(--bg);
    color:var(--ink);
    padding:28px 20px 60px;
  }
  h1{
    font-family:'Charter','Georgia',serif;
    font-weight:600;
    font-size:1.9rem;
    margin:0 0 2px;
    letter-spacing:.2px;
  }
  .lede{
    color:var(--muted);
    font-size:.98rem;
    max-width:640px;
    margin:0 0 22px;
    line-height:1.5;
  }
  .lede code{
    background:#eceae2;
    padding:1px 5px;
    border-radius:3px;
    font-family:'SFMono-Regular',Consolas,monospace;
    font-size:.85em;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    margin-bottom:18px;
  }
  button.reset{
    font-family:inherit;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
    font-size:.9rem;
  }
  button.reset:hover{background:#3a3d38;}

  .legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:.82rem;
    color:var(--muted);
  }
  .legend .swatch{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .legend .box{
    width:14px;height:14px;border-radius:2px;display:inline-block;flex:none;
  }
  .box.lockdemo{background:repeating-linear-gradient(45deg,var(--lock),var(--lock) 3px,#55584f 3px,#55584f 6px);}
  .box.seldemo{background:var(--ok);}
  .box.confdemo{background:repeating-linear-gradient(45deg,#cfcbbd,#cfcbbd 3px,#e2ded0 3px,#e2ded0 6px);}
  .box.availdemo{background:#fff;border:2px solid #3d5a80;}

  .layout{
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .grid-wrap{
    flex:1 1 780px;
    overflow-x:auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
  }

  .grid{
    display:grid;
    grid-template-columns: 74px repeat(13, minmax(78px,1fr));
    gap:3px;
    min-width:1150px;
  }

  .hour-head{
    text-align:center;
    font-size:.72rem;
    color:var(--muted);
    padding:4px 2px 8px;
    border-bottom:1px solid var(--line);
  }
  .hour-head b{
    display:block;
    font-size:.95rem;
    color:var(--ink);
    font-family:'Charter','Georgia',serif;
  }
  .corner{border-bottom:1px solid var(--line);}

  .day-label{
    display:flex;
    align-items:center;
    justify-content:center;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-family:'Charter','Georgia',serif;
    font-weight:600;
    font-size:1.02rem;
    background:#f1efe7;
    border-radius:4px;
    letter-spacing:.5px;
  }

  .cell{
    border-radius:4px;
    padding:6px 7px;
    font-size:.74rem;
    line-height:1.3;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:1px;
    position:relative;
    min-height:56px;
  }
  .cell .subj{
    font-family:'Charter','Georgia',serif;
    font-weight:700;
    font-size:.92rem;
  }
  .cell .meta{opacity:.92;}
  .cell .teacher{font-style:italic; opacity:.92;}

  .cell.lecture{
    cursor:default;
    background-image: repeating-linear-gradient(135deg, rgba(0,0,0,0.16) 0 6px, rgba(0,0,0,0) 6px 12px);
  }
  .cell.lecture::after{
    content:"🔒";
    position:absolute;
    top:5px; right:7px;
    font-size:.7rem;
    opacity:.85;
  }

  .cell.cviceni{cursor:pointer; transition:transform .1s ease;}
  .cell.cviceni.available{filter:brightness(1);}
  .cell.cviceni.available:hover{transform:translateY(-1px); box-shadow:0 3px 8px rgba(0,0,0,.18);}
  .cell.cviceni.available::after{
    content:"○";
    position:absolute; top:4px; right:7px; font-size:.85rem; opacity:.85;
  }

  .cell.cviceni.selected{
    outline:3px solid var(--ok);
    outline-offset:-3px;
  }
  .cell.cviceni.selected::after{
    content:"✓";
    position:absolute; top:3px; right:7px; font-size:.85rem;
    background:var(--ok); color:#fff; width:16px; height:16px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
  }

  .cell.cviceni.disabled{
    cursor:not-allowed;
    background:repeating-linear-gradient(45deg,#cfcbbd,#cfcbbd 5px,#e2ded0 5px,#e2ded0 10px) !important;
    color:#8a8778;
  }
  .cell.cviceni.disabled .teacher,
  .cell.cviceni.disabled .meta{opacity:.8;}
  .cell.cviceni.disabled::after{
    content:"✕";
    position:absolute; top:4px; right:7px; font-size:.75rem; opacity:.7;
  }

  .cell.cviceni.taken{
    cursor:pointer;
    background:repeating-linear-gradient(45deg,#cfcbbd,#cfcbbd 5px,#e2ded0 5px,#e2ded0 10px) !important;
    color:#8a8778;
  }
  .cell.cviceni.taken .teacher,
  .cell.cviceni.taken .meta{opacity:.8;}
  .cell.cviceni.taken:hover{transform:translateY(-1px); box-shadow:0 3px 8px rgba(0,0,0,.18);}
  .cell.cviceni.taken::after{
    content:"↺";
    position:absolute; top:4px; right:7px; font-size:.8rem; opacity:.75;
  }

  .empty{visibility:hidden;}

  .sidebar{
    flex:0 0 300px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 18px 20px;
    position:sticky;
    top:20px;
  }
  .sidebar h2{
    font-size:1.05rem;
    margin:0 0 12px;
    font-family:'Charter','Georgia',serif;
  }
  .sum-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:.86rem;
  }
  .sum-row:last-of-type{border-bottom:none;}
  .sum-row.hidden-row{opacity:.45;}
  .eye-btn{
    flex:none;
    border:none;
    background:none;
    cursor:pointer;
    font-size:.9rem;
    padding:2px 4px 2px 0;
    line-height:1;
    opacity:.75;
  }
  .eye-btn:hover{opacity:1;}
  .sum-subj{font-weight:700; flex:1;}
  .sum-subj-wrap{display:flex; flex-direction:column; flex:1; min-width:0;}
  .sum-fullname{
    font-weight:400;
    font-size:.72rem;
    color:var(--muted);
    white-space:normal;
    line-height:1.3;
  }
  .sum-detail{color:var(--muted); text-align:right; font-size:.8rem; line-height:1.4;}
  .sum-detail .warn{color:var(--bad); font-weight:600;}
  .sum-total{
    margin-top:14px;
    padding-top:12px;
    border-top:2px solid var(--ink);
    font-size:.9rem;
    display:flex;
    justify-content:space-between;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:5px;
    font-size:.86rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:900px){
    .layout{flex-direction:column;}
    .sidebar{position:static; width:100%;}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="reset" id="resetBtn">Vymazat výběr</button>
    <button class="reset" id="exportBtn" style="background:var(--ok);">Stáhnout jako obrázek</button>
    <div class="legend">
      <span class="swatch"><span class="box lockdemo"></span> přednáška (pevná)</span>
      <span class="swatch"><span class="box availdemo"></span> cvičení k výběru</span>
      <span class="swatch"><span class="box seldemo"></span> vybráno</span>
      <span class="swatch"><span class="box confdemo"></span> koliduje / nedostupné</span>
      <span class="swatch"><span class="box confdemo"></span> už vybráno u jiné varianty (klikni pro přepnutí)</span>
    </div>
  </div>

  <div class="layout">
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>

    <aside class="sidebar">
      <h2>Můj rozvrh</h2>
      <div id="summary"></div>
      <div class="sum-total"><span>Celkem hodin</span><span id="totalHours">0</span></div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ---------- ČASOVÁ MŘÍŽKA (reálné časy hodin) ---------- */
const HOURS = [
  { n:1,  label:'8:00–8:45' },
  { n:2,  label:'8:50–9:35' },
  { n:3,  label:'9:45–10:30' },
  { n:4,  label:'10:35–11:20' },
  { n:5,  label:'11:30–12:15' },
  { n:6,  label:'12:35–13:20' },
  { n:7,  label:'13:30–14:15' },
  { n:8,  label:'14:20–15:05' },
  { n:9,  label:'15:15–16:00' },
  { n:10, label:'16:05–16:50' },
  { n:11, label:'17:00–17:45' },
  { n:12, label:'17:50–18:35' },
  { n:13, label:'18:45–19:30' },
];

const DAYS = ['Pondělí','Úterý','Středa','Čtvrtek','Pátek'];
const LANES = [2,2,3,2,1]; // počet "pater" pro každý den, aby se vešly alternativy vedle sebe

/* ---------- BAREVNÁ PALETA PODLE PŘEDMĚTU ---------- */
const COLORS = {
  EKP:  '#c1613f',
  OS:   '#3d5a80',
  WT2:  '#4f8f74',
  SDA:  '#b9892f',
  PD_P: '#8457c9',
  SI:   '#c2415f',
  NUR:  '#1c7c9c',
  DSA:  '#2f8f6a',
  PS1a: '#d97b2e',
  IVVZ: '#5b4b93',
};

/* ---------- DATA ---------- */
// day: 0=Po,1=Út,2=St,3=Čt,4=Pá | type: 'prednaska' (pevná) | 'cviceni' (k výběru)
// start/span jsou ve sloupcích (hodinách), lane = pořadí "patra" v daném dni
let idc = 1;
const s = (day, type, subject, start, span, lane, room, cap, teacher) => ({
  id: 's'+(idc++), day, type, subject, start, span, lane, room, cap, teacher
});

const SESSIONS = [
  // PONDĚLÍ
  s(0,'cviceni','WT2', 1,2,1,'V9','0/28','Smrčka'),
  s(0,'cviceni','EKP', 2,2,0,'U18','0/30','Černá'),
  s(0,'prednaska','OS', 4,2,0,'P2','0/60','Smrčka'),
  s(0,'cviceni','OS',  6,2,0,'EIT','0/18','Smrčka'),
  s(0,'cviceni','EKP', 8,2,0,'U2','0/30','Černá'),
  s(0,'prednaska','SDA',10,2,0,'P2','0/60','Přibyl'),
  s(0,'cviceni','SDA', 12,2,0,'EIT','0/19','Přibyl'),

  // ÚTERÝ
  s(1,'cviceni','OS',  1,2,0,'EIT','0/18','Smrčka'),
  s(1,'cviceni','PD_P',1,2,1,'V2','0/20','Jeřábek'),
  s(1,'cviceni','OS',  3,2,0,'EIT','0/18','Smrčka'),
  s(1,'cviceni','PD_P',3,2,1,'V2','0/20','Jeřábek'),
  s(1,'prednaska','SI',5,2,0,'P2','0/60','Richta'),
  s(1,'prednaska','PD_P',7,2,0,'P3','0/40','Jeřábek'),
  s(1,'prednaska','NUR',10,1,0,'Výukové centrum','0/50','Jelínek'),
  s(1,'cviceni','NUR', 11,3,0,'V9','0/25','Jelínek'),

  // STŘEDA
  s(2,'prednaska','PS1a',1,2,1,'U13','0/40','Přibyl'),
  s(2,'cviceni','PS1a',  3,2,1,'EIT','0/20','Přibyl'),
  s(2,'prednaska','DSA', 4,2,0,'P2','0/60','Hyrš'),
  s(2,'cviceni','DSA',   6,2,0,'V4','0/18','Hyrš'),
  s(2,'cviceni','NUR',   6,3,1,'V9','0/25','Valentová'),
  s(2,'cviceni','PS1a',  7,2,2,'EIT','0/20','Přibyl'),
  s(2,'prednaska','WT2', 9,2,0,'P2','0/60','Smrčka'),
  s(2,'cviceni','WT2',   11,2,0,'V9','0/28','Smrčka'),

  // ČTVRTEK
  s(3,'prednaska','EP',1,2,0,'U6','0/30','Lízalová'),
  s(3,'cviceni','EP', 3,2,0,'TV','0/30','Lízalová'),
  s(3,'cviceni','DSA', 5,2,0,'V9','0/28','Hyrš'),
  s(3,'cviceni','POR',1,2,1,'ZSP1','0/20', 'Vláčilová, Další AP'),
  s(3,'prednaska','IVVZ',7,2,0,'V4','0/20','Pavlinec, Další AP'),
  s(3,'cviceni','SDA', 9,2,0,'EIT','0/19','Fraj'),
  s(3,'cviceni','SI',  9,2,1,'V7','0/28','Hyrš'),
  s(3,'cviceni','SDA', 11,2,0,'EIT','0/19','Fraj'),

  // PÁTEK
  s(4,'cviceni','SI',  5,2,0,'V9','0/28','Hyrš'),
  s(4,'cviceni','IVVZ',7,2,0,'V4','0/20','Pavlinec, Další AP'),
];

/* ---------- CELÉ NÁZVY PŘEDMĚTŮ ---------- */
const FULL_NAMES = {
  EKP:  'Efektivní komunikace a prezentace (PV B)',
  EP:   'Ekonomika podniku (PV B)',
  OS:   'Operační systémy (P)',
  WT2:  'Webové technologie (P)',
  SDA:  'Serverová a desktopová administrace (PV A1)',
  PD_P: 'Práce s daty (PV A1)',
  SI:   'Softwarové inženýrství (P)',
  NUR:  'Návrh uživatelského rozhraní (P)',
  DSA:  'Datové struktury a algoritmy (P)',
  PS1a: 'Úvod do počítačových sítí (N)',
  IVVZ: 'Informatika ve veřejné správě (PV B)',
  POR:  'Psychologie osobního rozvoje',
};

/* ---------- STAV ---------- */
// pro každý předmět uchováváme id vybraného cvičení (nebo null)
const state = {};
[...new Set(SESSIONS.map(x=>x.subject))].forEach(subj => state[subj] = null);

// předměty, které si uživatel schoval z tabulky (jen vizuálně, výběr zůstává zachovaný)
const hiddenSubjects = new Set();

/* ---------- POMOCNÉ FUNKCE ---------- */
function overlaps(a, b){
  return a.day === b.day && a.start < (b.start + b.span) && b.start < (a.start + a.span);
}

function activeSessions(excludeSubject){
  // skryté předměty nebrání výběru v jejich čase — chovají se, jako by v rozvrhu nebyly
  const active = SESSIONS.filter(x => x.type === 'prednaska' && !hiddenSubjects.has(x.subject));
  Object.entries(state).forEach(([subj, id]) => {
    if (id && subj !== excludeSubject && !hiddenSubjects.has(subj)){
      active.push(SESSIONS.find(x => x.id === id));
    }
  });
  return active;
}

function conflictFor(session){
  const others = activeSessions(session.subject);
  return others.find(o => overlaps(o, session));
}

function rowFor(day, lane){
  let row = 2; // řádek 1 = hlavička hodin
  for(let d=0; d<day; d++) row += LANES[d];
  return row + lane;
}

/* ---------- VYKRESLENÍ MŘÍŽKY ---------- */
const gridEl = document.getElementById('grid');

function buildGridSkeleton(){
  gridEl.innerHTML = '';

  // roh
  const corner = document.createElement('div');
  corner.className = 'corner';
  gridEl.appendChild(corner);

  // hlavička hodin
  HOURS.forEach(h => {
    const el = document.createElement('div');
    el.className = 'hour-head';
    el.style.gridColumn = `${h.n+1}`;
    el.style.gridRow = '1';
    el.innerHTML = `<b>${h.n}.</b>${h.label}`;
    gridEl.appendChild(el);
  });

  // popisky dnů
  DAYS.forEach((name, d) => {
    const el = document.createElement('div');
    el.className = 'day-label';
    el.textContent = name;
    el.style.gridColumn = '1';
    el.style.gridRow = `${rowFor(d,0)} / span ${LANES[d]}`;
    gridEl.appendChild(el);
  });

  gridEl.style.gridTemplateRows = `auto repeat(${LANES.reduce((a,b)=>a+b,0)}, minmax(56px,auto))`;
}

function renderSessions(){
  // odstranit staré buňky (ponechat hlavičku a popisky dnů)
  gridEl.querySelectorAll('.cell').forEach(el => el.remove());

  SESSIONS.forEach(session => {
    if (hiddenSubjects.has(session.subject)) return;

    const el = document.createElement('div');
    const color = COLORS[session.subject] || '#555';
    el.style.background = color;
    el.style.gridColumn = `${session.start+1} / span ${session.span}`;
    el.style.gridRow = `${rowFor(session.day, session.lane)}`;

    const typeLabel = session.type === 'prednaska' ? '1. př' : '1. cvi';

    el.innerHTML = `
      <span class="subj">${session.subject}</span>
      <span class="meta">${typeLabel} · ${session.room} · ${session.cap}</span>
      <span class="teacher">${session.teacher}</span>
    `;

    if (session.type === 'prednaska'){
      el.className = 'cell lecture';
    } else {
      el.className = 'cell cviceni';
      const isSelected = state[session.subject] === session.id;
      if (isSelected){
        el.classList.add('selected');
      } else {
        const conflict = conflictFor(session);
        const takenElsewhere = state[session.subject] && state[session.subject] !== session.id;
        if (conflict){
          el.classList.add('disabled');
          el.title = `Koliduje s ${conflict.subject} (${conflict.type === 'prednaska' ? 'přednáška' : 'cvičení'})`;
        } else if (takenElsewhere){
          const chosen = SESSIONS.find(x => x.id === state[session.subject]);
          el.classList.add('taken');
          el.title = `${session.subject} už máš vybrané u jiného cvičení (${chosen.room}, ${chosen.teacher}) — klikni pro přepnutí sem`;
        } else {
          el.classList.add('available');
        }
      }
      el.addEventListener('click', () => onCvicClick(session));
    }

    gridEl.appendChild(el);
  });
}

/* ---------- INTERAKCE ---------- */
function onCvicClick(session){
  const currentlySelected = state[session.subject] === session.id;

  if (currentlySelected){
    state[session.subject] = null;
    renderAll();
    return;
  }

  const conflict = conflictFor(session);
  if (conflict){
    showToast(`Nejde vybrat — koliduje s ${conflict.subject} (${conflict.room}, ${conflict.teacher}).`);
    return;
  }

  state[session.subject] = session.id;
  renderAll();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- SOUHRN ---------- */
function renderSummary(){
  const box = document.getElementById('summary');
  box.innerHTML = '';
  let totalHours = 0;

  const subjects = [...new Set(SESSIONS.map(x=>x.subject))].sort();

  subjects.forEach(subj => {
    const lecture = SESSIONS.find(x => x.subject === subj && x.type === 'prednaska');
    const chosenId = state[subj];
    const chosen = chosenId ? SESSIONS.find(x => x.id === chosenId) : null;
    const hasCviceni = SESSIONS.some(x => x.subject === subj && x.type === 'cviceni');
    const isHidden = hiddenSubjects.has(subj);

    const row = document.createElement('div');
    row.className = 'sum-row';
    if (isHidden) row.classList.add('hidden-row');

    let detailHtml = '';
    if (lecture){
      totalHours += lecture.span;
      detailHtml += `${DAYS[lecture.day].slice(0,2)} ${lecture.start}.–${lecture.start+lecture.span-1}. (př)<br>`;
    }
    if (hasCviceni){
      if (chosen){
        totalHours += chosen.span;
        detailHtml += `${DAYS[chosen.day].slice(0,2)} ${chosen.start}.–${chosen.start+chosen.span-1}. (cvi, ${chosen.teacher})`;
      } else {
        detailHtml += `<span class="warn">cvičení nezvoleno</span>`;
      }
    }

    row.innerHTML = `
      <button class="eye-btn" title="${isHidden ? 'Zobrazit v tabulce' : 'Skrýt z tabulky'}" data-subj="${subj}">${isHidden ? '🚫' : '👁'}</button>
      <span class="sum-subj-wrap">
        <span class="sum-subj" style="color:${COLORS[subj]}">${subj}</span>
        <span class="sum-fullname">${FULL_NAMES[subj] || ''}</span>
      </span>
      <span class="sum-detail">${detailHtml}</span>
    `;
    row.querySelector('.eye-btn').addEventListener('click', () => toggleHidden(subj));
    box.appendChild(row);
  });

  document.getElementById('totalHours').textContent = totalHours;
}

function toggleHidden(subj){
  if (hiddenSubjects.has(subj)) hiddenSubjects.delete(subj);
  else hiddenSubjects.add(subj);
  renderAll();
}

/* ---------- HLAVNÍ RENDER ---------- */
function renderAll(){
  renderSessions();
  renderSummary();
}

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(state).forEach(k => state[k] = null);
  renderAll();
});

/* ---------- EXPORT OBRÁZKU ---------- */
function getActiveSessionsForExport(){
  const lectures = SESSIONS.filter(x => x.type === 'prednaska' && !hiddenSubjects.has(x.subject));
  const chosen = Object.entries(state)
    .filter(([subj, id]) => id && !hiddenSubjects.has(subj))
    .map(([subj, id]) => SESSIONS.find(x => x.id === id));
  return [...lectures, ...chosen];
}

function buildExportNode(){
  const activeList = getActiveSessionsForExport();

  const wrap = document.createElement('div');
  wrap.className = 'grid-wrap';
  wrap.style.position = 'fixed';
  wrap.style.top = '0';
  wrap.style.left = '-9999px';
  wrap.style.width = '1150px';

  const grid = document.createElement('div');
  grid.className = 'grid';
  wrap.appendChild(grid);

  const corner = document.createElement('div');
  corner.className = 'corner';
  grid.appendChild(corner);

  HOURS.forEach(h => {
    const el = document.createElement('div');
    el.className = 'hour-head';
    el.style.gridColumn = `${h.n+1}`;
    el.style.gridRow = '1';
    el.innerHTML = `<b>${h.n}.</b>${h.label}`;
    grid.appendChild(el);
  });

  // v exportu má každý den jen jedno "patro" — vybrané věci se v rámci
  // dne nikdy nepřekrývají časově, takže jdou hezky vedle sebe do jedné řady
  const dayRow = d => 2 + d;

  DAYS.forEach((name, d) => {
    const el = document.createElement('div');
    el.className = 'day-label';
    el.textContent = name;
    el.style.gridColumn = '1';
    el.style.gridRow = `${dayRow(d)}`;
    grid.appendChild(el);
  });

  grid.style.gridTemplateRows = `auto repeat(${DAYS.length}, minmax(56px,auto))`;

  activeList.forEach(session => {
    const el = document.createElement('div');
    const color = COLORS[session.subject] || '#555';
    el.style.background = color;
    el.style.gridColumn = `${session.start+1} / span ${session.span}`;
    el.style.gridRow = `${dayRow(session.day)}`;

    const typeLabel = session.type === 'prednaska' ? '1. př' : '1. cvi';
    el.className = session.type === 'prednaska' ? 'cell lecture' : 'cell cviceni selected';
    el.innerHTML = `
      <span class="subj">${session.subject}</span>
      <span class="meta">${typeLabel} · ${session.room} · ${session.cap}</span>
      <span class="teacher">${session.teacher}</span>
    `;
    grid.appendChild(el);
  });

  document.body.appendChild(wrap);
  return wrap;
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const btn = document.getElementById('exportBtn');

  if (typeof html2canvas === 'undefined'){
    showToast('Export se nepodařilo načíst — zkontroluj připojení k internetu a zkus to znovu.');
    return;
  }

  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Ukládám…';

  const exportNode = buildExportNode();

  html2canvas(exportNode, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'muj-rozvrh.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(() => {
    showToast('Export obrázku se nepovedl, zkus to prosím znovu.');
  }).finally(() => {
    exportNode.remove();
    btn.disabled = false;
    btn.textContent = originalLabel;
  });
});

buildGridSkeleton();
renderAll();
</script>
</body>
